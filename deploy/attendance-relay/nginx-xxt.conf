server {
    listen 80;
    listen [::]:80;
    server_name xxt.raviportfolio.cc;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/raviportfolio/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://xxt.raviportfolio.cc$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name xxt.raviportfolio.cc;

    ssl_certificate /etc/letsencrypt/live/xxt.raviportfolio.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xxt.raviportfolio.cc/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:MumuAttendanceTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log /var/log/nginx/mumu-attendance.access.log;
    error_log /var/log/nginx/mumu-attendance.error.log warn;
    server_tokens off;
    client_max_body_size 5m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(self), microphone=()" always;
    add_header Strict-Transport-Security "max-age=15552000" always;

    location = /api/admin/sessions {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8878;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    location ^~ /api/admin/sessions/ {
        proxy_pass http://127.0.0.1:8878;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    location = /api/admin/groups {
        limit_except GET POST { deny all; }
        proxy_pass http://127.0.0.1:8878;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    location ^~ /api/admin/groups/ {
        proxy_pass http://127.0.0.1:8878;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    location ^~ /api/qr/ {
        proxy_pass http://127.0.0.1:8878;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    location ^~ /qr/ {
        proxy_pass http://127.0.0.1:8878;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    location ^~ /assets/ {
        proxy_pass http://127.0.0.1:8878;
        proxy_set_header Host $host;
        expires 1h;
    }

    location = /api/health {
        proxy_pass http://127.0.0.1:8878;
        proxy_set_header Host $host;
    }

    location / {
        return 404;
    }
}
